<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Student Registration — CPMS</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .reg-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 580px;
      z-index: 10;
    }
    .portal-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      backdrop-filter: blur(10px);
      transition: var(--transition);
    }
    .portal-back-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="login-page">
  <div class="login-glow-bg" style="top: 10%; left: 15%; background: #10b981;"></div>
  <div class="login-glow-bg" style="bottom: 10%; right: 15%; background: #06b6d4;"></div>

  <div class="reg-wrapper">
    <a href="/student/login" class="portal-back-link">
      <span>←</span> Back to Student Login
    </a>

    <div class="login-card" style="width: 100%; max-width: 580px; padding: 36px 34px;">
      <div class="login-logo" style="background: var(--student-gradient); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);">
        👨‍🎓
      </div>
      <h1 class="login-title">Student Registration</h1>
      <p class="login-sub">Create your profile to participate in campus placement drives</p>

      <form id="form">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input id="name" type="text" placeholder="e.g. Rahul Sharma" required/>
          </div>
          <div class="form-group">
            <label for="email">College Email *</label>
            <input id="email" type="email" placeholder="rahul@college.edu.in" required/>
          </div>
          <div class="form-group">
            <label for="password">Password *</label>
            <input id="password" type="password" placeholder="Min. 6 characters" required minlength="6"/>
          </div>
          <div class="form-group">
            <label for="department">Department / Branch</label>
            <input id="department" type="text" placeholder="e.g. Computer Science"/>
          </div>
          <div class="form-group">
            <label for="year">Academic Year</label>
            <select id="year">
              <option value="">Select Current Year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year (Final Year)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cgpa">Current CGPA (0.00 – 10.00)</label>
            <input id="cgpa" type="number" step="0.01" min="0" max="10" placeholder="e.g. 8.75"/>
          </div>
          <div class="form-group form-full">
            <label for="phone">Contact Mobile Number</label>
            <input id="phone" type="tel" placeholder="+91 98765 43210"/>
          </div>
        </div>

        <button id="btn" type="submit" class="btn btn-success" style="width: 100%; padding: 12px; margin-top: 24px; font-size: 14px;">
          <span>Create Student Profile</span>
          <span style="font-size: 16px;">→</span>
        </button>
      </form>

      <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border); padding-top: 16px;">
        <span style="font-size: 13px; color: var(--text-secondary);">
          Already have an account? <a href="/student/login" style="color: var(--success); font-weight: 600;">Sign in here</a>
        </span>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span>Creating profile…</span>';
  btn.disabled = true;

  const body = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    department: document.getElementById('department').value.trim(),
    year: document.getElementById('year').value,
    cgpa: document.getElementById('cgpa').value,
    phone: document.getElementById('phone').value.trim()
  };

  try {
    await API.post('/api/auth/student/register', body);
    toast('Account created successfully!', 'success');
    setTimeout(() => window.location.href = '/student/dashboard', 600);
  } catch(err) {
    toast(err.message, 'error');
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
